[package]
name = "recallport"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Local, cross-client long-term memory for AI assistants, served over MCP."
license = "MIT"
repository = "https://github.com/danchar12138/recallport"
readme = "README.md"
keywords = ["mcp", "memory", "ai", "local-first", "semantic-search"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
arrow-array = "58"
arrow-schema = "58"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs4 = "0.13"
futures = "0.3"
jieba-rs = "0.8"
lance-index = "=14.0.2"
lancedb = { version = "=0.41.0", default-features = false }
minijinja = { version = "2", features = ["urlencode"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "api-27"] }
rmcp = { version = "=3.11.0", features = ["transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0

[profile.release]
strip = true
