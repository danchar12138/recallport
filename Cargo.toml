[package]
name = "recallport"
version = "1.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Local, cross-client long-term memory for AI assistants, served over MCP."
license = "MIT"
repository = "https://github.com/danchar12138/recallport"
readme = "README.md"
keywords = ["mcp", "memory", "ai", "local-first", "semantic-search"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs4 = "0.13"
jieba-rs = "0.8"
mime_guess = "2"
minijinja = { version = "2", features = ["urlencode"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "api-27"] }
rmcp = { version = "=3.11.0", features = ["transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
toml_edit = "0.25.19"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.dev]
debug = 0

[profile.release]
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_Graphics_Gdi"] }
