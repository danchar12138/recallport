name: 功能建议 / Feature request
description: 提出新想法 / Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题 / What problem are you trying to solve
      description: 先说场景和痛点，再说方案
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的方案 / Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: 与项目原则一致 / Fits the project principles
      options:
        - label: 保持本地优先，不引入云端依赖、遥测或运行时联网
        - label: AI 写入的记忆保持追加式，更正通过新增记忆完成
